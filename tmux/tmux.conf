# ==========================
# CẤU HÌNH TMUX CƠ BẢN
# ==========================

# 1. Đổi phím Prefix từ Ctrl+b mặc định sang Ctrl+a (giống screen, dễ bấm hơn)
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
# 2. Bật hỗ trợ chuột (Cho phép click chọn pane, kéo thả viền để resize, và scroll)
set -g mouse on

# 3. Đánh số Window và Pane bắt đầu từ 1 (thay vì 0, giúp dễ bấm phím số hơn)
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# 4. Tăng thời gian lưu lịch sử cuộn trang (scroll history)
set -g history-limit 10000

# ==========================
# PHÍM TẮT (KEY BINDINGS)
# ==========================

# Cài đặt phím r để reload lại file cấu hình nhanh chóng
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Đã reload ~/.config/tmux/tmux.conf!"

# Chia đôi màn hình (Split panes) dễ nhớ hơn bằng phím | và -
# Mở pane mới tại cùng thư mục hiện tại
unbind '"'
unbind "%"

# Chia dọc
bind "|" split-window -h -c "#{pane_current_path}" 

# Chia ngang
bind "-" split-window -v -c "#{pane_current_path}" 

# Điều hướng giữa các pane bằng phím tắt kiểu Vim (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Điều chỉnh kích thước pane bằng mũi tên (cần giữ phím Prefix)
bind -r Left resize-pane -L
bind -r Down resize-pane -D
bind -r Up resize-pane -U
b
